# (remap capslock to CTRL for easy access)
# change the prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# minimize escape
set -sg escape-time 0


# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# Show sessions in status right
set -g status-right-length 80

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# enable vi mode keys
set-window-option -g mode-keys vi

# set default terminal mode to 256 colors
set -g default-terminal "$TERM"
set -ga terminal-overrides ",$TERM:Tc"

# present a menu of URLs to open from the visible pane. sweet.
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"


# Design Tweaks
# -------------

# Theme — semantic color palette. Inherits the terminal's ANSI palette
# (default, ansi names, colour0-15) so switching terminals or themes carries
# over automatically. To retheme, override these and reload.
# Style/format options reference these via #{@col-*}; clock-mode-colour uses
# `-F` (expand at set-time) because colour-type options don't auto-expand.
set -g @col-bg         'default'      # terminal bg
set -g @col-fg         'default'      # terminal fg
set -g @col-on-accent  'colour0'      # text drawn on accent/highlight bgs; ANSI black
set -g @col-fg-bright  'colour15'     # ANSI bright-white
set -g @col-border     'colour8'      # ANSI bright-black; muted grey
set -g @col-accent     'cyan'         # ANSI cyan; distinct from yellow accent-2
set -g @col-accent-2   'yellow'       # ANSI yellow (theme-dependent: lemon → gold)
set -g @col-prefix     'brightyellow' # ANSI bright yellow
set -g @col-mark       'brightyellow' # ANSI bright yellow
set -g @col-warn       'red'          # ANSI red

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -gF clock-mode-colour '#{@col-accent-2}'
setw -g  mode-style 'fg=#{@col-on-accent} bg=#{@col-accent} bold'

# panes — borders are uniformly brown; the active pane is signaled by
# arrow markers in the title row, not by border color. avoids the
# T-junction color-mismatch artifact between heavy adjacent borders.
set -g @highlight-borders 'off'
set -g pane-border-style        "#{?pane_marked,fg=black bg=black,fg=#{@col-border}}"
set -g pane-active-border-style "#{?pane_marked,fg=black bg=black,fg=#{@col-border}}"

# heavy borders with a per-pane title row. active pane is wrapped with
# ▶ ◀ markers; custom @name overrides "#P: command" when set; @highlight
# fills the title row with the tag color.
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-indicators off
set -g pane-border-format "#{?pane_marked,#[align=centre fg=#{@col-mark} bold]━━━ ,}#{?@highlight,#[align=centre bg=#{@highlight} fg=#{@col-on-accent} bold]    #{?pane_active,▶ ,}#{?@name,#{@name},#P: #{pane_current_command}}#{?pane_active, ◀,}    #[default],#{?pane_active,#[align=centre fg=#{@col-accent} bold]▶ #{?@name,#{@name},#P: #{pane_current_command}} ◀,#[align=centre fg=#{@col-fg}]#{?@name,#{@name},#P: #{pane_current_command}}}}#{?pane_marked,#[fg=#{@col-mark} bold] ━━━,}"

# right-click pane menu — defaults plus a Highlight submenu
bind-key -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" "select-pane -t = ; send-keys -M" "display-menu -T '#[align=centre]#{pane_index} (#{pane_id})' -t = -x M -y M \
  'Horizontal Split' h 'split-window -h' \
  'Vertical Split'   v 'split-window -v' \
  '' \
  'Highlight...'     H \"display-menu -T 'Highlight' -x M -y M \
    Green   g 'set -p @highlight green' \
    Cyan    c 'set -p @highlight cyan' \
    Yellow  y 'set -p @highlight yellow' \
    Magenta m 'set -p @highlight magenta' \
    Red     r 'set -p @highlight red' \
    Blue    b 'set -p @highlight blue' \
    White   w 'set -p @highlight white' \
    '' \
    Clear   x 'set -p -u @highlight'\" \
  'Rename...'     n \"command-prompt -p 'Pane name:' -I '#{@name}' { set -p @name '%%' }\" \
  '#{?@name,Clear Name,-Clear Name}' N 'set -p -u @name' \
  '' \
  '#{?#{>:#{window_panes},1},,-}Swap Up'   u 'swap-pane -U' \
  '#{?#{>:#{window_panes},1},,-}Swap Down' d 'swap-pane -D' \
  '#{?pane_marked_set,,-}Swap Marked'      s 'swap-pane' \
  '' \
  'Kill'    X 'kill-pane' \
  'Respawn' R 'respawn-pane -k' \
  '#{?pane_marked,Unmark,Mark}' M 'select-pane -m' \
  '#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}' z 'resize-pane -Z'"

# statusbar
set -g status-position bottom
set -g status-style 'fg=#{@col-fg}'

set -g status-left '#{?client_prefix,#[fg=#{@col-prefix}],#[fg=#{@col-fg}]} #(echo "#{s/-/ /}#{session_name}" | awk '\''{if(length($0) > 20) print substr($0,1,17)"..."; else print $0}'\'') '
set -g status-left-length 80

set -g status-right-style 'fg=#{@col-on-accent} bg=#{@col-accent-2}'
set -g status-right '#[reverse]#[noreverse]%Y-%m-%d %H:%M#[reverse]#[noreverse]'

setw -g window-status-current-style 'fg=#{@col-on-accent} bg=#{@col-accent}'
setw -g window-status-current-format '#[reverse]#[noreverse] #I #W #[reverse]#[noreverse]'

setw -g window-status-style 'fg=#{@col-fg} bg=default'
setw -g window-status-separator ''
setw -g window-status-format ' #I #[fg=#{@col-fg-bright}]#W #[fg=#{@col-accent-2}]#F '

setw -g window-status-bell-style 'fg=#{@col-accent-2} bg=#{@col-warn} bold'

# messages
set -g message-style 'fg=#{@col-accent-2} bg=#{@col-bg} bold'

# sessions
set -g @sessionx-bind 'T'
set -g @sessionx-filter-current 'false'
set -g @sessionx-window-mode 'off'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @continuum-boot-options 'kitty'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'mrilikecoding/tmux-highlight'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
